        <script>
                  document.write(gf_title2);
                </script></h1><!-- Header: Time -->

          <td><!-- 点击弹日历，选中日期写回本框（框架标准入力候補リンク） --> <input class="LINK_TEXT" name="LNKINP_PLAN_END_DATE" onclick="
                          var url = './_calendar_yyyymmdd.htm';
                          var sx = '400';
                          var sy = '400';
                          var sh = '350';
                          var sw = '700';
                          var sob = 'LNKINP_PLAN_END_DATE';
                          var ads = '';
                          if (this.name.indexOf('_R_') + 1) {
                            ads = this.name.substring(this.name.indexOf('_R_'));
                          }
                          if (document.querySelector('*[name=' + sob + ']')) {
                            url =
                              url +
                              '?PARAM=' +
                              document.querySelector('*[name=' + sob + ']')
                                .value;
                          }
                          window.open(
                            url,
                            sob + ads,
                            'left=' +
                              sx +
                              ',top=' +
                              sy +
                              ',width=' +
                              sw +
                              ',height=' +
                              sh,
                          );
                        " readonly size="11" type="text" value="DUE DATE"></td>

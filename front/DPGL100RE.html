  <script type="text/javascript">
      //<![CDATA[
      function finalTaskForUser() {
        // Read the text of each priority color block（HIGH/MEDIUM/LOW）
        // Add corresponding class and clear text
        var nodes = document.querySelectorAll('[id^="NMLLBL_PRIORITY_FLAG"]');
        for (var i = 0; i < nodes.length; i++) {
          var s = nodes[i];
          var t = (s.textContent || "").toUpperCase();
          if (t.indexOf("HIGH") >= 0) {
            s.classList.add("pri-high");
          } else if (t.indexOf("LOW") >= 0) {
            s.classList.add("pri-low");
          } else if (t.indexOf("MEDIUM") >= 0) {
            s.classList.add("pri-medium");
          }
          s.innerHTML = "";
        }
      }
      //]]>
    </script><!-- ========================================================== -->

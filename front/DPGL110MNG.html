  <script type="text/javascript">
      //<![CDATA[
      function finalTaskForUser() {
        var cells = document.querySelectorAll(".pri-flag");
        for (var i = 0; i < cells.length; i++) {
          var v = (cells[i].textContent || "").trim().toUpperCase();
          cells[i].classList.remove("pri-high", "pri-medium", "pri-low");
          if (v === "HIGH") {
            cells[i].classList.add("pri-high");
          } else if (v === "MEDIUM") {
            cells[i].classList.add("pri-medium");
          } else if (v === "LOW") {
            cells[i].classList.add("pri-low");
          }
        }
      }
      //]]>
    </script>

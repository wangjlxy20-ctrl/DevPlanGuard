  <script type="text/javascript">
      //<![CDATA[
      function finalTaskForUser() {
        // 审批状态色块：空值视为待审批
        var rv = document.querySelectorAll(".rv-flag");
        for (var i = 0; i < rv.length; i++) {
          var v = (rv[i].textContent || "").trim().toUpperCase();
          rv[i].classList.remove("rv-passed", "rv-failed", "rv-pending");
          if (v === "PASSED") {
            rv[i].classList.add("rv-passed");
          } else if (v === "FAILED") {
            rv[i].classList.add("rv-failed");
          } else {
            rv[i].classList.add("rv-pending");
            if (v === "") {
              rv[i].textContent = "PENDING";
            }
          }
        }
      }
      //]]>
    </script>

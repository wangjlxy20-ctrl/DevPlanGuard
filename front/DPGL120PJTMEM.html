  <script type="text/javascript">
      function finalTaskForUser() {
        // 优先级色块
        var pri = document.querySelectorAll(".pri-flag");
        for (var i = 0; i < pri.length; i++) {
          var v = (pri[i].textContent || "").trim().toUpperCase();
          pri[i].classList.remove("pri-high", "pri-medium", "pri-low");
          if (v === "HIGH") pri[i].classList.add("pri-high");
          else if (v === "MEDIUM") pri[i].classList.add("pri-medium");
          else if (v === "LOW") pri[i].classList.add("pri-low");
        }
        // 剩余天数着色：<0 逾期，<=3 临期，其余正常
        var days = document.querySelectorAll(".day-flag");
        for (var j = 0; j < days.length; j++) {
          var d = parseInt((days[j].textContent || "").trim(), 10);
          days[j].classList.remove("day-overdue", "day-soon", "day-normal");
          if (isNaN(d)) continue;
          if (d < 0) days[j].classList.add("day-overdue");
          else if (d <= 3) days[j].classList.add("day-soon");
          else days[j].classList.add("day-normal");
        }
      }
    </script>

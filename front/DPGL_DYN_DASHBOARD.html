    <style type="text/css">
      /* <![CDATA[ */
      .layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      .sidebar {
        width: 220px;
        flex-shrink: 0;
        background: #f7f7f7;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 8px;
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      .menu-item {
        width: 100%;
        box-sizing: border-box;
        border: none;
        background: transparent;
        text-align: left;
        padding: 8px 10px;
        margin-bottom: 2px;
        cursor: pointer;
        border-radius: 3px;
        font-size: 14px;
        color: #333;
      }
      .menu-item:hover {
        background: #e8f0fe;
      }
      .menu-item.active {
        background: #1a73e8;
        color: #fff;
      }
      .menu-group > summary {
        list-style: none;
        padding: 8px 10px;
        font-size: 14px;
        font-weight: bold;
        color: #333;
        cursor: pointer;
        border-radius: 3px;
      }
      .menu-group > summary::-webkit-details-marker {
        display: none;
      }
      .menu-group > summary::after {
        content: "\25B8";
        float: right;
        color: #888;
      }
      .menu-group[open] > summary::after {
        content: "\25BE";
      }
      .menu-group > summary:hover {
        background: #e8f0fe;
      }
      .submenu {
        padding-left: 12px;
      }

      .dashboard-top-area {
        text-align: center;
        margin-bottom: 14px;
      }
      .page-title {
        margin: 0;
        font-size: 32px;
        font-weight: bold;
        color: #1a73e8;
      }
      .time-area {
        white-space: nowrap;
        font-size: 13px;
        margin-top: 6px;
        color: #5b6b7c;
      }

      /* 项目选择区 */
      .select-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f4f7fb;
        border: 1px solid #d8dee7;
        border-radius: 6px;
        padding: 10px 14px;
        margin-bottom: 14px;
      }
      .select-bar label {
        font-weight: bold;
        font-size: 14px;
        color: #33475b;
        white-space: nowrap;
      }
      .select-bar select {
        flex: 1;
        max-width: 480px;
        padding: 6px 8px;
        font-size: 14px;
      }

      /* 图表网格 */
      .chart-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 14px;
      }
      .chart-card {
        border: 1px solid #d8dee7;
        border-radius: 6px;
        padding: 10px;
        background: #fff;
        display: flex;
        justify-content: center;
      }
      .chart-card.full {
        grid-column: 1 / -1;
      }
      /* The user's original style can be described here */

      /* ]]> */

    <script type="text/javascript">
      //<![CDATA[
      function menuGo(screenId, el) {
        document.main.COMMAND_NAME.value = "COMMAND_LNKMOV_AC_OPEN_FROM_MENU";
        linkOpen(screenId, el.value, el.name);
      }
      // EzgSvg 隐藏 iframe 控制：加载本图形的控制 JSP
      function ezgControl(ifr, graphicName, embName) {
        if (!top.htmlFrame) {
          return;
        }
        var index = window.location.href.lastIndexOf("/");
        var noUrl = window.location.href.substring(0, index) + "/none";
        if (ifr.src == "" || ifr.src == "about:blank" || ifr.src == noUrl) {
          ifr.src =
            "./_EzgSvgControl.jsp?PJT_NAME=default&GRAPHIC_NAME=" +
            graphicName +
            "&SVGEMB_NAME=" +
            embName +
            "&REFRESH_TIME=500&SCREEN_ID=" +
            top.htmlFrame.document.main.SCREEN_ID.value +
            "&WINDOW_ID=" +
            top.name;
        }
      }
      function _chkInputValue() {
        return true;
      }
      function finalTaskForUser() {}
      //]]>
    </script>

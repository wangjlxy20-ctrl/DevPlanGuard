 <body>
  <div id="wrapper">
   <!-- ===== 通用按钮栏：Back / Main / Logout（样板同 DPGL200.html） =====
           写法与页内 BTNCMD 完全一致（class=BTNCMD + readonly + 设置
           COMMAND_NAME + SendBTN(this.name)）。放在 #wrapper 内：框架的
           form(main) 由共通 JS 生成，页面里的 BTNCMD 都在这个容器内，
           放外面按钮值可能不进请求。 -->
   <div id="nav-bar" style="
          position: sticky;
          top: 0;
          z-index: 999;
          display: flex;
          justify-content: flex-end;
          gap: 6px;
          padding: 4px 8px;
          background: #f7f7f7;
          border-bottom: 1px solid #ddd;
        ">
    <input type="text" class="BTNCMD" name="BTNCMD_BACK" value="Back" readonly onclick="
            document.main.COMMAND_NAME.value = 'COMMAND_BTNCMD_BACK';
            SendBTN(this.name);
          "> <input type="text" class="BTNCMD" name="BTNCMD_MAIN" value="Main" readonly onclick="
            document.main.COMMAND_NAME.value = 'COMMAND_BTNCMD_MAIN';
            SendBTN(this.name);
          "> <input type="text" class="BTNCMD" name="BTNCMD_LOGOUT" value="Logout" readonly onclick="
            document.main.COMMAND_NAME.value = 'COMMAND_BTNCMD_LOGOUT';
            SendBTN(this.name);
          ">
   </div><!-- ===== /通用按钮栏 ===== --> <input type="hidden" id="grandsight_ex_disp_date_format" name="grandsight_ex_disp_date_format" value=""> <input type="hidden" id="grandsight_ex_time_zone" name="grandsight_ex_time_zone" value=""> <!-- Save the current project_id--> <input type="hidden" id="NMLTXT_PROJECT_ID" name="NMLTXT_PROJECT_ID" value="" size="" maxlength="" style="" class="NMLTXT_NORMAL">
   <table style="width: 100%">
    <tbody>
     <tr>
      <td id="root"><!-- Screen name -->
       <h1>
        <script>
                  document.write(gf_title2);
                </script></h1><!-- Header: current time and BACK -->
       <table class="header-table">
        <tbody>
         <tr>
          <td style="text-align: left; font-size: 12px; color: #555"><span class="NMLLBL_NORMAL" id="NMLLBL_NOW_DATE" value="">YYYY/MM/DD HH:MI:SS</span></td>
          <td style="text-align: right; white-space: nowrap"></td>
         </tr>
        </tbody>
       </table><!-- Project information -->
       <table class="info-table">
        <tbody>
         <tr>
          <td class="label-cell">Project ID</td>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_DISPLAY_INFO_PROJECT_ID" value="" style="font-weight: bold"></span></td>
         </tr>
         <tr>
          <td class="label-cell">Project Name</td>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_DISPLAY_INFO_PROJECT_NAME" value=""></span></td>
         </tr>
         <tr>
          <td class="label-cell">Project Member Count</td>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_DISPLAY_INFO_MEMBER_COUNT" value=""></span></td>
         </tr>
         <tr>
          <td class="label-cell">Add Project Member</td>
          <td><input class="LINK_TEXT" name="LNKSUB_MEMBER_SEARCH_ADD" onclick="
                          var swi = 'DPGL100MEMA';
                          var sx = '50';
                          var sy = '50';
                          var sh = '600';
                          var sw = '900';
                          var sob = '';
                          var ads = '';
                          if (this.name.indexOf('_R_') + 1) {
                            ads = this.name.substring(this.name.indexOf('_R_'));
                          }
                          openSubWindowXYHW(swi, sob + ads, sx, sy, sh, sw);
                          //Pass the project_id to the child window
                          // (the 3rd parameter of openSubWindowAddParamXYHW)
                          var pid = document.main.NMLTXT_PROJECT_ID.value;
                          openSubWindowAddParamXYHW(
                            swi,
                            sob + ads,
                            '&amp;PROJECT_ID=' + pid,
                            sx,
                            sy,
                            sh,
                            sw,
                          );
                        " readonly size="" type="text" value="ADD MEMBER"></td>
         </tr>
        </tbody>
       </table><!-- Member list -->
       <div class="section-title">
        Project Member List
       </div>
       <table class="member-table" id="TABLE_MEMBER">
        <colgroup>
         <col class="col-name">
         <col class="col-role">
         <col class="col-count">
         <col class="col-count">
        </colgroup>
        <thead>
         <tr>
          <th>Member Name</th>
          <th>Member Role</th>
          <th>Assigned Tasks</th>
          <th>Completed Tasks</th>
         </tr>
        </thead>
        <tbody>
         <!-- TEMPLATE ROW -->
         <tr>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_MEMBER_NAME" value=""></span></td>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_MEMBER_ROLE" value=""></span></td>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_ASSIGNED_TASK_COUNT" value=""></span></td>
          <td><span class="NMLLBL_NORMAL" id="NMLLBL_COMPLETED_TASK_COUNT" value=""></span></td>
         </tr>
        </tbody>
       </table></td>
     </tr>

      <td>
       <div id="errorLocation" style="font-size: small; color: Gray"></div></td>

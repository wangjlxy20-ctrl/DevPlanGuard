  <script type="text/javascript">
      //<![CDATA[
      // =========================================================
      // Task Type 联动：选 TEST 显示测试信息，选 DEFECT 显示缺陷信息
      // 与测试提交页 toggleBugList() 同样的做法（纯 HTML+JS，不改框架）
      // =========================================================
      var TEST_EXTRA_ROWS = ["TEST_EXTRA_PLAN_ROW", "TEST_EXTRA_CASE_ROW"];
      var DEFECT_EXTRA_ROWS = ["DEFECT_EXTRA_SEVERITY_ROW"];
      function setRowVisible(rowId, visible) {
        var row = document.getElementById(rowId);
        if (row) {
          row.style.display = visible ? "" : "none";
        }
      }
      // 清空隐藏区域的已填内容，防止切换类型后残留脏数据被提交
      function clearTestFields() {
        var plan = document.getElementById("NMLTXT_TEST_PLAN");
        var design = document.getElementById("NMLTXA_TEST_CASE_DESIGN");
        if (plan) plan.value = "";
        if (design) design.value = "";
      }
      function clearDefectFields() {
        var sev = document.getElementById("NMLDLD_SEVERITY");
        if (sev) sev.selectedIndex = 0;
      }
      function toggleTaskTypeFields(type) {
        var isTest = type === "TEST";
        var isDefect = type === "DEFECT";
        for (var i = 0; i < TEST_EXTRA_ROWS.length; i++) {
          setRowVisible(TEST_EXTRA_ROWS[i], isTest);
        }
        for (var j = 0; j < DEFECT_EXTRA_ROWS.length; j++) {
          setRowVisible(DEFECT_EXTRA_ROWS[j], isDefect);
        }
        if (!isTest) {
          clearTestFields();
        }
        if (!isDefect) {
          clearDefectFields();
        }
      }
      //]]>
    </script>

  <script type="text/javascript">
      //<![CDATA[
      function finalTaskForUser() {
        // 绑定 Task Type 变化事件（委托绑定，框架重绘 select 也不会失效）
        if (window.jQuery) {
          jQuery(document).off("change.dpgl110", "#NMLDLD_TASK_TYPE");
          jQuery(document).on(
            "change.dpgl110",
            "#NMLDLD_TASK_TYPE",
            function () {
              toggleTaskTypeFields(this.value);
            },
          );
          var sel = jQuery("#NMLDLD_TASK_TYPE");
          if (sel.length) {
            toggleTaskTypeFields(sel.val());
          }
        } else {
          var s = document.getElementById("NMLDLD_TASK_TYPE");
          if (s) {
            s.onchange = function () {
              toggleTaskTypeFields(this.value);
            };
            toggleTaskTypeFields(s.value);
          }
        }
      }
      //]]>
    </script>

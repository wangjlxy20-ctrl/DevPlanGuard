      .header-table {

      .section-title {
        margin: 12px 0 8px;

      }
      /* Status Color Block */
      .st-done {

      }
      .st-doing {

        color: #fff;
      }
      .st-todo {

      .st-other {

      }
      .st-done,

  <script type="text/javascript">
      //<![CDATA[
      function finalTaskForUser() {
        // PRIORITY COLOR BLOCK
        var pri = document.querySelectorAll(".pri-flag");
        for (var i = 0; i < pri.length; i++) {
          var v = (pri[i].textContent || "").trim().toUpperCase();
          pri[i].classList.remove("pri-high", "pri-medium", "pri-low");
          if (v === "HIGH") {
            pri[i].classList.add("pri-high");
          } else if (v === "MEDIUM") {
            pri[i].classList.add("pri-medium");
          } else if (v === "LOW") {
            pri[i].classList.add("pri-low");
          }
        }
        // STATUS COLOR BLOCK
        var st = document.querySelectorAll(".st-flag");
        for (var j = 0; j < st.length; j++) {
          var s = (st[j].textContent || "").trim().toUpperCase();
          st[j].classList.remove("st-done", "st-doing", "st-todo", "st-other");
          if (s === "DONE") {
            st[j].classList.add("st-done");
          } else if (s === "IN_PROGRESS" || s === "DOING") {
            st[j].classList.add("st-doing");
          } else if (s === "TODO" || s === "PENDING") {
            st[j].classList.add("st-todo");
          } else {
            st[j].classList.add("st-other");
          }
        }
      }
      //]]>
    </script>

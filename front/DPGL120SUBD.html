  <script type="text/javascript">
      //<![CDATA[
      jQuery(function(){
        jQuery("#upload_button").on("click", function(){
          var fileList = jQuery("#upload_files").prop("files");
          if(!fileList || fileList.length === 0){ alert("Please choose a file first."); return; }
          var formData = new FormData();
          formData.append("files", fileList[0]);
          jQuery.ajax("./servlet/FileUpload", {
            method: "POST", contentType: false, data: formData, processData: false, dataType: "text"
          }).done(function(data){
            var resp = JSON.parse(data);
            if(resp.success && resp.files && resp.files.length > 0){
              var fi = resp.files[0];
              if(fi.success){
                jQuery("#NMLTXT_DELIVERABLE_FILE").val(fi.storedFilename);
                jQuery("#upload_result").html("Uploaded: " + fi.storedFilename);
              } else { alert("Upload failed: " + fi.errorMessage); }
            } else { alert("Upload failed: " + resp.errorMessage); }
          }).fail(function(jqXHR){
            if(jqXHR.status === 0){ alert("文件可能过大，或网络中断。"); }
            else if(jqXHR.responseText){ try{ var r=JSON.parse(jqXHR.responseText); alert("Upload failed: " + r.errorMessage); }catch(e){ alert("Upload failed."); } }
            else { alert("Upload failed."); }
          });
        });
      });
      //]]>
    </script>
